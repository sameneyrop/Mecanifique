<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mecanifique Mostrador</title>
<meta name="description" content="Panel de Mostrador para refaccionarias de Mecanifique.">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/mecanifique-logo-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<!--
  Mostrador: el panel de las refaccionarias (servidor: src/mostrador.ts y
  src/routes/mostrador.ts). Los mecánicos preguntan una pieza desde la app,
  aquí suena y la tienda contesta con precio y existencia; si el mecánico la
  aparta, se entrega y el ticket entra solo al servicio.

  - Se entra por invitación: el admin manda el enlace /mostrador?invitacion=…
  - Habla con la API de Render; para probar con el servidor local:
    mostrador.html?api=http://localhost:3000 (solo acepta localhost, para que
    un enlace no pueda mandar la contraseña a otro servidor).
  - Se actualiza por el canal en tiempo real store:<id> (solo un aviso, sin
    datos) y, por si se cae, cada 10 segundos.
-->
<style>
  :root {
    --bg: #E3ECF8;
    --surface: #FFFFFF;
    --soft: #EEF3FA;
    --line: #D6E4F5;
    --ink: #0B0F22;
    --muted: #4A5568;
    --primary: #2F8FEA;
    --primary-ink: #1C6DC4;
    --on-primary: #FFFFFF;
    --accent: #F2B84B;
    --accent-bg: rgba(242, 184, 75, 0.18);
    --accent-ink: #8A5A00;
    --ok: #15803D;
    --ok-bg: #D9F3E4;
    --danger: #C0392B;
    --danger-bg: #FBE3E0;
    --shadow: 0 1px 2px rgba(11, 31, 51, 0.06), 0 8px 24px rgba(11, 31, 51, 0.07);
    --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1F33; --surface: #132A44; --soft: #1A3552; --line: #28486B; --ink: #E8EFF7; --muted: #A7B6C8;
      --primary: #2F8FEA; --primary-ink: #7DB8F2; --on-primary: #FFFFFF;
      --accent: #F2B84B; --accent-bg: rgba(242, 184, 75, 0.16); --accent-ink: #F2C46B;
      --ok: #7EE2A8; --ok-bg: #143D2A; --danger: #FF8A80; --danger-bg: #3D1F22;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px); }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  a { color: var(--primary-ink); font-weight: 700; }
  svg { flex-shrink: 0; }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* Entrar / invitación */
  .auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .auth-card { width: min(440px, 100%); background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 16px; }
  .auth-brand { display: flex; align-items: baseline; gap: 8px; }
  .auth-brand strong { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; color: var(--primary-ink); }
  .auth-brand span { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .auth h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; text-wrap: balance; }
  .auth p { margin: 0; color: var(--muted); }
  .auth form { display: grid; gap: 12px; }
  .auth .fineprint { font-size: 13px; }
  .auth .error { background: var(--danger-bg); color: var(--danger); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; }
  .auth .info { background: var(--soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .link-btn { border: 0; background: none; padding: 6px 0; color: var(--primary-ink); font-weight: 700; justify-self: start; min-height: 40px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--primary); animation: spin 0.8s linear infinite; justify-self: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Barra de arriba */
  .top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 10px 20px; flex-wrap: wrap; }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand strong { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; color: var(--primary-ink); }
  .brand span { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .store { font-weight: 700; font-size: 14px; color: var(--muted); min-width: 0; }
  .store select { border: 1px solid var(--line); background: var(--soft); border-radius: 10px; padding: 6px 8px; font-weight: 700; max-width: 260px; }
  .top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .switch { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; background: var(--soft); font-weight: 700; font-size: 14px; }
  .switch .knob { width: 56px; height: 32px; border-radius: 99px; background: var(--line); position: relative; transition: background .2s; border: 0; padding: 0; }
  .switch .knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .switch[data-on="true"] .knob { background: var(--ok); }
  .switch[data-on="true"] .knob::after { transform: translateX(24px); }
  .icon-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: 13px; min-height: 44px; }
  .icon-btn[aria-pressed="true"] { border-color: var(--primary); color: var(--primary-ink); }
  .clock { font-weight: 700; color: var(--muted); font-size: 14px; }
  .conn { width: 10px; height: 10px; border-radius: 50%; background: var(--ok); }
  .conn.off { background: var(--danger); }

  /* Esqueleto */
  .shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; max-width: 1240px; margin: 0 auto; padding: 20px 20px 80px; }
  nav.side { display: grid; gap: 4px; align-content: start; position: sticky; top: 76px; }
  nav.side button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: transparent; padding: 11px 12px; border-radius: 12px; font-weight: 700; color: var(--muted); min-height: 52px; }
  nav.side button[aria-current="page"] { background: var(--surface); color: var(--primary-ink); box-shadow: var(--shadow); }
  nav.side .badge { margin-left: auto; min-width: 24px; height: 24px; border-radius: 99px; background: var(--primary); color: var(--on-primary); font-size: 12px; display: grid; place-items: center; padding: 0 7px; }
  nav.side .badge.accent { background: var(--accent); color: #3B2A00; }
  .side-foot { margin-top: 14px; display: grid; gap: 6px; font-size: 13px; color: var(--muted); padding: 0 12px; }
  .side-foot button { border: 0; background: none; padding: 8px 0; text-align: left; color: var(--primary-ink); font-weight: 700; }
  main { min-width: 0; display: grid; gap: 16px; align-content: start; }

  h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  .strip { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-stat { background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); box-shadow: var(--shadow); }
  .chip-stat b { color: var(--ink); }

  .banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); font-weight: 600; flex-wrap: wrap; }
  .banner.warn { background: var(--accent-bg); box-shadow: none; }
  .banner.bad { background: var(--danger-bg); color: var(--danger); box-shadow: none; }
  .banner > span { flex: 1 1 240px; }

  /* Tarjetas */
  .card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; }
  .req.new { border: 2px solid var(--primary); }
  .req.done { opacity: .72; }
  @keyframes arrive { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes ring { 0%,100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 0 6px rgba(47,143,234,.25); } }
  .ringing { animation: arrive .5s ease, ring 1s ease 3; }
  .req-top { display: flex; gap: 12px; align-items: flex-start; }
  .req-icon { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; color: var(--primary-ink); }
  .req-title { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .req-title h3 { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .req-title .car { font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 14px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .timer { text-align: right; flex-shrink: 0; }
  .timer b { display: block; font-size: 20px; font-weight: 800; }
  .timer small { color: var(--muted); font-size: 12px; font-weight: 600; }
  .timer.urgent b { color: var(--danger); }
  .note { background: var(--soft); border-radius: 12px; padding: 9px 12px; font-size: 14px; overflow-wrap: anywhere; }
  .compete { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .pill.new { background: var(--primary); color: var(--on-primary); }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.wait { background: var(--accent-bg); color: var(--accent-ink); }
  .pill.off { background: var(--soft); color: var(--muted); }
  .title-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
  .btn.primary { background: var(--primary); color: var(--on-primary); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn.soft { background: var(--soft); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--primary-ink); padding-inline: 10px; }
  .btn.danger { background: transparent; color: var(--danger); padding-inline: 10px; }
  .btn.big { flex: 1 1 150px; font-size: 16px; min-height: 60px; }
  .btn.wide { width: 100%; }
  .btn:disabled { opacity: .55; cursor: default; }
  body.busy [data-act], body.busy form button { pointer-events: none; opacity: .6; }

  /* Formulario de respuesta */
  .answer { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 12px; }
  .option { background: var(--soft); border-radius: 14px; padding: 12px; display: grid; gap: 10px; }
  .option.typing { box-shadow: inset 0 0 0 2px var(--primary); }
  .option-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 14px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  label.f { display: grid; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
  label.f input, label.f select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 11px; font-size: 16px; color: var(--ink); width: 100%; min-width: 0; min-height: 50px; }
  .price-wrap { position: relative; }
  .price-wrap span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; }
  .price-wrap input { padding-left: 24px !important; font-weight: 800; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 14px; min-height: 48px; }
  .seg button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary-ink); background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
  .reasons { display: flex; gap: 8px; flex-wrap: wrap; }
  .option .btn.soft, .pay-form .btn.soft, .cancel-form .btn.soft { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); flex: 1 1 120px; }
  .keypad-box { display: grid; gap: 8px; }
  .keypad-box .hint b { color: var(--ink); }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 420px; }
  .keypad button { min-height: 58px; border: 0; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 24px; font-weight: 800; color: var(--ink); }
  .keypad button.fn { font-size: 15px; color: var(--muted); }

  .empty { text-align: center; padding: 34px 18px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
  .empty strong { color: var(--ink); font-size: 17px; }

  /* Apartados */
  .items { display: grid; gap: 6px; }
  .item-row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; background: var(--soft); border-radius: 10px; padding: 8px 12px; }
  .item-row b { white-space: nowrap; }
  .method { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; flex-wrap: wrap; }
  .pay-form, .cancel-form { display: grid; gap: 10px; background: var(--soft); border-radius: 14px; padding: 12px; }
  .cancel-form input { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 11px; font-size: 16px; min-height: 50px; width: 100%; }
  .contact { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 14px; }

  /* Tabla de entregadas */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  td.money { font-weight: 800; white-space: nowrap; }

  /* Estadísticas */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
  .tile small { color: var(--muted); font-weight: 700; font-size: 13px; }
  .tile b { display: block; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
  .tile span { font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .bars { display: grid; gap: 6px; align-items: end; height: 150px; }
  .bar { display: grid; gap: 4px; justify-items: center; align-content: end; height: 100%; }
  .bar i { width: 100%; border-radius: 6px 6px 2px 2px; background: var(--primary); min-height: 3px; }
  .bar.now i { background: var(--accent); }
  .bar span { font-size: 11px; color: var(--muted); font-weight: 600; }
  .rank { display: grid; gap: 8px; }
  .rank-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; font-size: 14px; }
  .rank-row .track { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .rank-row .track i { display: block; height: 100%; background: var(--primary); border-radius: 99px; }
  .missing-row { display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px; border-radius: 10px; background: var(--accent-bg); font-size: 14px; }
  h2 { margin: 0; font-size: 17px; font-weight: 800; }
  .hint { margin: 0; color: var(--muted); font-size: 13px; }

  /* Mi tienda */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 7px 14px; font-weight: 700; font-size: 14px; min-height: 48px; }
  .chips button[aria-pressed="true"] { border-color: var(--primary); color: var(--primary-ink); background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
  .inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
  .inline-form label.f { flex: 1 1 240px; }

  .toasts { position: fixed; left: 50%; top: calc(76px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
  .toast { background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.25); animation: arrive .3s ease; display: flex; gap: 10px; align-items: center; }
  .toast.win { background: var(--ok); color: #fff; }
  .toast.bad { background: var(--danger); color: #fff; }
  .waking { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 35; margin: 0 auto; max-width: 520px;
    background: var(--surface); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); padding: 12px 14px; display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 14px; }
  .waking .spinner { width: 22px; height: 22px; margin: 0; }

  @media (max-width: 860px) {
    .top { padding: 10px 16px; position: static; }
    .toasts { top: calc(16px + env(safe-area-inset-top, 0px)); }
    .shell { grid-template-columns: 1fr; padding: 12px 16px 80px; gap: 12px; }
    nav.side { position: static; display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    nav.side button { white-space: nowrap; width: auto; flex-shrink: 0; padding: 9px 12px; }
    .side-foot { display: none; }
    .clock { display: none; }
    .timer b { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) { .ringing, .toast, .spinner { animation: none; } }

  /* Pantallas táctiles: todo se toca con el dedo y el precio se escribe con el teclado en pantalla. */
  button, input, select, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button { user-select: none; -webkit-user-select: none; transition: transform .08s ease, filter .08s ease; }
  button:active:not(:disabled) { transform: scale(.97); filter: brightness(.94); }
  @media (pointer: coarse) {
    body { font-size: 16px; }
    .btn.big { min-height: 64px; font-size: 17px; }
    .keypad button { min-height: 64px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="waking" id="waking" hidden><div class="spinner"></div><span>Conectando con Mecanifique… la primera vez del día puede tardar hasta un minuto.</span></div>

<script>
(function () {
  "use strict";

  /* ---------- Servidor ---------- */
  const PROD_API = "https://mecanifique.onrender.com";
  const params = new URLSearchParams(location.search);
  const localApi = params.get("api");
  const API = localApi && /^http:\/\/(localhost|127\.0\.0\.1)(:\d{2,5})?$/.test(localApi) ? localApi : PROD_API;
  const CONTACT = "ameneyro.design@gmail.com";
  const POLL_MS = 10000;
  const RING_AGAIN_MS = 45000;

  /* ---------- Guardado en este navegador (la sesión y preferencias) ---------- */
  const saved = {
    get(key) { try { return localStorage.getItem(key + "@" + API); } catch (e) { return null; } },
    set(key, value) {
      try {
        if (value == null) localStorage.removeItem(key + "@" + API);
        else localStorage.setItem(key + "@" + API, value);
      } catch (e) { /* sin almacenamiento: la sesión dura lo que la pestaña */ }
    }
  };
  let session = null;
  try { session = JSON.parse(saved.get("mostrador.session") || "null"); } catch (e) { session = null; }
  function saveSession(next) {
    session = next && next.accessToken ? { accessToken: next.accessToken, refreshToken: next.refreshToken || null } : null;
    saved.set("mostrador.session", session ? JSON.stringify(session) : null);
  }

  /* ---------- Íconos ---------- */
  const I = {
    bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
    mute: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.7 3A6 6 0 0 1 18 8c0 2.7.6 4.6 1.3 6"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/></svg>',
