<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volante del tianguis · Mecanifique</title>
<!--
  Volante para el tianguis de autos de los domingos: «Revisión antes de
  comprar». Media carta (5.5 × 8.5 in), SOLO FRENTE, DOS POR HOJA CARTA
  horizontal (11 × 8.5 in). Se corta por la línea punteada del centro.

  La app no tiene un tipo de servicio aparte para esto: el cliente pide un
  mecánico normal y en «Descripción de la falla» escribe «Revisión antes de
  comprar». Por eso el volante lo dice tal cual.

  Todo lo arma JavaScript: el auto «SE VENDE» de la portada, los banderines
  del tianguis, el sello de revisado, el código QR y el acomodo en la hoja.

  Imprimir (Chrome o Edge, Ctrl+P): tamaño Carta, orientación Horizontal,
  márgenes «Ninguno», escala 100 %, «Gráficos de fondo» activado, una sola
  cara.

  Opciones (también en la barra de arriba):
  - ?tinta=1   versión ahorro de tinta (portada en azul claro)
  - ?solo=1    la hoja a tamaño real, sin barra (para exportar)
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --navy: #08273a;
    --blue: #0072b2;
    --bright: #2f8fea;
    --sun: #f2b84b;
    --ink: #12374f;
    --muted: #5b7487;
    --pale: #eef5fb;
    --line: #d4e4f0;
    --white: #ffffff;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    --marker: "Permanent Marker", "Comic Sans MS", cursive;
    /* Portada en color: el tianguis de noche, como la campaña de Facebook. */
    --hero-bg: var(--navy);
    --hero-ink: var(--white);
    --asphalt: rgba(255, 255, 255, 0.05);
    --stall: rgba(255, 255, 255, 0.16);
    --car: var(--bright);
    --car-line: rgba(8, 39, 58, 0.35);
    --glass: #0d3a57;
    --scribble: #ffffff;
    --tire: #04141f;
    --rim: #a9c1d3;
    --shadow: rgba(0, 0, 0, 0.35);
    --string: rgba(255, 255, 255, 0.35);
  }
  /* Ahorro de tinta: portada clara, el auto en azul suave. */
  body.ink {
    --hero-bg: #e7f0f9;
    --hero-ink: var(--navy);
    --asphalt: rgba(0, 114, 178, 0.06);
    --stall: rgba(0, 114, 178, 0.22);
    --car: #a9cdea;
    --car-line: rgba(0, 114, 178, 0.35);
    --glass: #e9f3fb;
    --scribble: var(--navy);
    --tire: #5b7487;
    --rim: #e7f0f9;
    --shadow: rgba(0, 114, 178, 0.14);
    --string: rgba(0, 114, 178, 0.35);
  }

  @page { size: letter landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #c9d6e0; font-family: var(--font); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* ---------- Barra de pantalla (no se imprime) ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; }
  .toolbar strong { font-size: 16px; color: var(--navy); }
  .toolbar button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--blue); color: var(--white); cursor: pointer; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
  .toolbar .how { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .sheets { padding: 24px 0 48px; display: grid; justify-content: center; zoom: var(--fit, 1); }

  /* ---------- Hoja carta horizontal con dos volantes ---------- */
  .sheet { width: 11in; height: 8.5in; background: var(--white); position: relative; overflow: hidden;
    display: grid; grid-template-columns: 5.5in 5.5in; box-shadow: 0 6px 24px rgba(8, 39, 58, 0.18); }
  .cut { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed #a8bccb; }
  .cut::before, .cut::after { content: "✂"; position: absolute; left: -0.08in; font-size: 10pt; color: #8aa3b5; }
  .cut::before { top: 0.3in; transform: rotate(-90deg); }
  .cut::after { bottom: 0.3in; transform: rotate(90deg); }

  @media print {
    body { background: var(--white); }
    .toolbar { display: none; }
    .sheets { padding: 0; zoom: 1; display: block; }
    .sheet { box-shadow: none; }
  }
  body.solo { background: var(--white); }
  body.solo .toolbar { display: none; }
  body.solo .sheets { padding: 0; zoom: 1; display: block; }
  body.solo .sheet { box-shadow: none; }

  /* ---------- Un volante (media carta, solo frente) ---------- */
  .flyer { width: 5.5in; height: 8.5in; padding: 0.3in; display: flex; flex-direction: column; overflow: hidden; }
  /* En esta tipografía el punto es muy ancho: a tamaño grande se ve despegado. */
  .pd { margin: 0 -0.05em; }
  .pd-end { margin-left: -0.07em; }

  .hero { position: relative; height: 2.75in; border-radius: 0.2in; overflow: hidden; background: var(--hero-bg); color: var(--hero-ink); flex-shrink: 0; }
  .hero svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-top { position: absolute; top: 0.18in; left: 0.2in; right: 0.18in; display: flex; justify-content: space-between; align-items: center; }
  .hero-top img { height: 0.23in; display: block; }
  .zone { font-size: 6.6pt; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sun);
    border: 1px solid rgba(242, 184, 75, 0.6); border-radius: 99px; padding: 0.045in 0.11in; }
  body.ink .zone { color: #8a5a00; border-color: rgba(138, 90, 0, 0.45); }

  .copy { padding: 0.17in 0.04in 0; }
  .q { margin: 0 0 0.05in; font-size: 12.5pt; font-weight: 800; color: var(--blue); letter-spacing: -0.01em; }
  h1 { margin: 0; font-size: 26pt; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; color: var(--navy); text-wrap: balance; }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { margin: 0.08in 0 0; font-size: 10pt; line-height: 1.42; color: var(--ink); text-wrap: pretty; }

  .inspect { margin: 0.13in 0.04in 0; padding-top: 0.11in; border-top: 1px solid var(--line); }
  .kicker { margin: 0; font-size: 7pt; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .checks { margin: 0.06in 0 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.06in 0.14in; }
  .check { display: flex; gap: 0.06in; align-items: flex-start; }
  .check svg { width: 0.16in; height: 0.16in; color: var(--blue); flex-shrink: 0; margin-top: 0.01in; }
  .check b { display: block; font-size: 9pt; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .check span { display: block; font-size: 7.4pt; color: var(--muted); font-weight: 600; line-height: 1.3; }
  .papers { margin: 0.08in 0 0; font-size: 7.4pt; line-height: 1.38; color: var(--ink); }
  .papers b { color: var(--navy); }

  .ask { margin: 0.12in 0.04in 0.12in; background: var(--pale); border: 1px solid var(--line); border-left: 0.05in solid var(--sun);
    border-radius: 0.1in; padding: 0.08in 0.13in; }
  .ask p { margin: 0.02in 0 0; font-size: 8.6pt; line-height: 1.38; color: var(--ink); }
  .ask .say { font-weight: 800; color: var(--navy); white-space: nowrap; }

  .download { margin-top: auto; display: flex; gap: 0.17in; align-items: center; border: 1.5px solid var(--line); border-radius: 0.18in; padding: 0.13in; }
  .qr { width: 1.12in; height: 1.12in; flex-shrink: 0; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .download .kicker { font-size: 7.4pt; }
  .download .url { margin: 0.03in 0 0.06in; font-size: 14pt; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; line-height: 1.12; }
  .download .url span { color: var(--blue); }
  .badge { display: inline-block; font-size: 7.6pt; font-weight: 800; color: var(--navy); background: var(--sun); border-radius: 99px; padding: 0.03in 0.1in; }
  .download .how { margin: 0.07in 0 0; font-size: 7.2pt; line-height: 1.34; color: var(--muted); }
  .download b { color: var(--ink); }
</style>
</head>

/**
 * Portada: el auto en venta del tianguis, con «SE VENDE» y el precio
 * escritos en los vidrios, los banderines del lote y el sello de revisado.
 * El auto se dibuja en la cuadrícula del ícono y se escala a la escena.
 */
function sceneSvg() {
  const W = 480, H = 270;
  const ground = 250, s = 0.57, carX = 222;
  const tx = carX - 512.5 * s, ty = ground - 650 * s;

  // Cajones del estacionamiento, inclinados, detrás del auto.
  let stalls = "";
  for (let x = -60; x <= W + 60; x += 64) stalls += `<line x1="${x}" y1="${H}" x2="${x + 34}" y2="${ground - 46}" />`;

  // Banderines del lote: una cuerda colgada y triángulos de colores.
  const flags = [];
  const n = 17, y0 = 58, sag = 18;
  const ink = document.body.classList.contains("ink");
  // En ahorro de tinta el banderín blanco no se vería sobre el fondo claro.
  const colors = ["#f2b84b", "#2f8fea", ink ? "#8fbbe0" : "#ffffff"];
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n;
    const x = -6 + t * (W + 12);
    const y = y0 + sag * 4 * t * (1 - t);
    flags.push(`<path d="M${(x - 9).toFixed(1)} ${(y - 1).toFixed(1)} L${(x + 9).toFixed(1)} ${(y + 1).toFixed(1)} L${x.toFixed(1)} ${(y + 17).toFixed(1)}Z" fill="${colors[i % 3]}" opacity="${ink ? 0.75 : 0.85}" />`);
  }
  const rope = `M-6 ${y0} Q${W / 2} ${y0 + sag * 2} ${W + 6} ${y0}`;

  // Sello de «revisado», como el holograma pegado en el parabrisas.
  const sx = 418, sy = 128, sr = 32;
  const ring = `M${sx - sr + 7} ${sy} a${sr - 7} ${sr - 7} 0 1 1 ${2 * (sr - 7)} 0 a${sr - 7} ${sr - 7} 0 1 1 ${-2 * (sr - 7)} 0`;
  const seal = `<g transform="rotate(-10 ${sx} ${sy})">
      <circle cx="${sx}" cy="${sy}" r="${sr}" fill="#f2b84b" />
      <circle cx="${sx}" cy="${sy}" r="${sr - 13}" fill="#08273a" />
      <path id="sealRing" d="${ring}" fill="none" />
      <text font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-size="7" font-weight="800" fill="#08273a">
        <textPath href="#sealRing" startOffset="0" textLength="${(2 * Math.PI * (sr - 7) - 3).toFixed(1)}" lengthAdjust="spacing">REVISADO · ANTES DE PAGAR ·</textPath>
      </text>
      <path d="M${sx - 9} ${sy + 0.5} l6 6 l12 -13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    </g>`;

  const marker = 'font-family="Permanent Marker, Comic Sans MS, cursive"';
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <rect x="0" y="${ground - 46}" width="${W}" height="${H}" fill="var(--asphalt)" />
    <g stroke="var(--stall)" stroke-width="3">${stalls}</g>
    <path d="${rope}" fill="none" stroke="var(--string)" stroke-width="1.2" />
    ${flags.join("")}
    <g transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${s})">
      <ellipse cx="512" cy="652" rx="345" ry="16" fill="var(--shadow)" />
      <circle cx="329" cy="606" r="46" fill="var(--tire)" />
      <circle cx="714" cy="606" r="46" fill="var(--tire)" />
      <circle cx="329" cy="606" r="21" fill="var(--rim)" />
      <circle cx="714" cy="606" r="21" fill="var(--rim)" />
      <polygon points="${pts(CAR)}" fill="var(--car)" />
      <polygon points="338,481 388,433 462,433 462,481" fill="var(--glass)" />
      <polygon points="476,433 560,433 606,481 476,481" fill="var(--glass)" />
      <g stroke="var(--car-line)" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M469 490 V588" />
        <path d="M640 495 Q646 548 652 588" />
        <path d="M238 520 H 790" opacity="0.6" />
      </g>
      <rect x="420" y="530" width="26" height="7" rx="3.5" fill="var(--car-line)" />
      <rect x="590" y="530" width="26" height="7" rx="3.5" fill="var(--car-line)" />
      <rect x="788" y="523" width="22" height="16" rx="5" fill="#f2b84b" />
      <rect x="207" y="528" width="16" height="18" rx="4" fill="#e2574c" />
      <text x="402" y="470" ${marker} font-size="21" fill="var(--scribble)" text-anchor="middle" transform="rotate(-5 402 470)">SE VENDE</text>
      <text x="532" y="470" ${marker} font-size="21" fill="var(--scribble)" text-anchor="middle" transform="rotate(-4 532 470)">${esc(CONFIG.price)}</text>
    </g>
    ${seal}
  </svg>`;
}

/** Código QR como SVG nítido (corrección "M": aguanta arrugas del papel). */
function qrSvg(text) {
  if (typeof qrcode === "undefined") return '<p style="font-size:7pt">Sin internet: no se generó el QR.</p>';
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const pad = 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  const size = n + pad * 2;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="Código QR: ${esc(text)}">
    <rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#08273a"/></svg>`;
}

function urlHtml(url) {
  const plain = pretty(url);
  const slash = plain.indexOf("/");
  return slash > 0 ? `${dots(plain.slice(0, slash))}<span>${dots(plain.slice(slash))}</span>` : dots(plain);
}

  const checks = [

  return `<article class="flyer">
    <div class="hero">
      ${sceneSvg()}
      <div class="hero-top"><img src="${ink ? LOGO_BLUE : LOGO_WHITE}" alt="Mecanifique"><span class="zone">${esc(CONFIG.city)} · autos y motos</span></div>
    </div>
    <div class="copy">
      <p class="q">¿Vas a comprar un auto usado?</p>
      <h1>Que lo revise un mecánico <em>antes de pagar<span class="pd-end">.</span></em></h1>
      <p class="lead">Lo pides desde tu celular y va a donde esté el auto: aquí en el tianguis o donde lo vayas a ver. Ves quién es y cuánto cobra antes de que llegue.</p>
    </div>
    <div class="inspect">
      <p class="kicker">Pídele que revise</p>
      <div class="checks">${checks.map(([t, d]) => `<div class="check">${CHECK}<div><b>${esc(t)}</b><span>${esc(d)}</span></div></div>`).join("")}</div>
      <p class="papers"><b>Los papeles, tú:</b> la factura, el número de serie y que no tenga reporte de robo en <b>${dots("repuve.gob.mx")}</b>.</p>
    </div>
    <div class="ask">
      <p class="kicker">Así la pides</p>
      <p>Pide un mecánico y en la descripción escribe <span class="say">«Revisión antes de comprar»</span>.</p>
    </div>
    <div class="download">
      <div class="qr">${qrSvg(CONFIG.downloadUrl)}</div>
      <div>
        <p class="kicker">Descárgala gratis</p>
        <p class="url">${urlHtml(CONFIG.downloadUrl)}</p>
        <span class="badge">App para Android</span>
        <p class="how">Aún no está en Play Store: Android te pedirá permiso para instalarla. ¿iPhone? Anótate en <b>${dots(CONFIG.site)}</b>.</p>
      </div>
    </div>
  </article>`;
}

const params = new URLSearchParams(location.search);
const state = { ink: params.get("tinta") === "1" };

function render() {
  document.body.classList.toggle("ink", state.ink);
  // Dos volantes por hoja; el id del círculo del sello no se puede repetir.
  const one = flyer(state.ink);
  const two = one.replace(/sealRing/g, "sealRing2");
  document.getElementById("sheets").innerHTML = `<section class="sheet">${one}${two}<div class="cut" aria-hidden="true"></div></section>`;
  fit();
}

// En pantalla, que la hoja quepa a lo ancho; al imprimir va a tamaño real.
function fit() {
  const width = 11 * 96 + 32;
  document.documentElement.style.setProperty("--fit", String(Math.min(1, window.innerWidth / width)));
}

if (params.get("solo") === "1") document.body.classList.add("solo");
document.getElementById("ink").checked = state.ink;
document.getElementById("ink").addEventListener("change", (e) => { state.ink = e.target.checked; render(); });
document.getElementById("print").addEventListener("click", () => window.print());
window.addEventListener("resize", fit);
render();
// El sello y los vidrios usan fuentes web: se vuelve a dibujar ya cargadas.
document.fonts.ready.then(() => { render(); document.body.dataset.ready = "1"; });
</script>
</body>
</html>
