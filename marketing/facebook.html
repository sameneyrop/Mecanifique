<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imágenes de Facebook · Mecanifique</title>
<!--
  Imágenes para la página de Facebook de Mecanifique, dibujadas con
  JavaScript (canvas) a la medida exacta que pide Facebook:

  - Foto de perfil   720 × 720   (Facebook la recorta en círculo)
  - Portada          1640 × 924  (completa en el celular; en computadora
                                  recorta arriba y abajo, por eso lo
                                  importante va en la franja de en medio)
  - Publicaciones    1080 × 1350 (4:5, la que más espacio ocupa en el celular)

  Uso: ábrelo en Chrome o Edge (con internet, para la tipografía y el QR) y
  toca «Descargar» debajo de cada imagen. Cada publicación trae un texto
  sugerido para pegar al publicar.

  Para cambiar la ciudad o el enlace, edita CONFIG abajo.
  Con ?solo=<id> (p. ej. facebook.html?solo=portada) muestra una sola imagen a
  tamaño real, sin márgenes: así se exportan los PNG en marketing/facebook/.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --blue: #0072b2;
    --navy: #08273a;
    --ink: #12374f;
    --muted: #5b7487;
    --pale: #eef5fb;
    --line: #d4e4f0;
    --sun: #f2b84b;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); color: var(--ink); background: var(--pale); }
  header { padding: 40px 24px 8px; max-width: 1180px; margin: 0 auto; }
  header h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.02em; color: var(--navy); }
  header p { margin: 0; color: var(--muted); max-width: 60ch; line-height: 1.5; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 24px 64px; display: grid; gap: 28px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 12px; align-content: start; }
  .card.wide { grid-column: 1 / -1; }
  .card canvas { width: 100%; height: auto; border-radius: 10px; display: block; background: var(--line); }
  .card.profile canvas { border-radius: 50%; max-width: 320px; justify-self: center; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .meta h2 { margin: 0; font-size: 17px; color: var(--navy); }
  .meta span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tip { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-weight: 700; font-size: 14px; border-radius: 999px; padding: 10px 16px; cursor: pointer;
    border: 1px solid var(--blue); background: var(--blue); color: #fff; }
  button.soft { background: #fff; color: var(--blue); }
  textarea { width: 100%; min-height: 150px; font: inherit; font-size: 14px; line-height: 1.45; color: var(--ink);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; resize: vertical; background: var(--pale); }
  body.solo { background: #fff; overflow: hidden; }
  body.solo header, body.solo main { display: none; }
  body.solo #solo { display: block; }
  #solo { display: none; }
  #solo canvas { display: block; }
</style>
</head>

</header>
<main id="grid"></main>

// En esta tipografía el punto y la coma son muy anchos (0.41 em): a tamaño
// grande se ven despegados ("auto ."). Se acercan a las letras.
const PUNCT = /([.,])/;
function wordParts(word) {
  return word.split(PUNCT).filter(Boolean);
}
function wordWidth(ctx, word, size) {
  const k = size * 0.09;
  const parts = wordParts(word);
  let width = 0;
  parts.forEach((part, i) => {
    width += ctx.measureText(part).width;
    if (PUNCT.test(part) && part.length === 1) {
      if (i > 0) width -= k;
      if (i < parts.length - 1) width -= k;
    }
  });
  return width;
}
function drawWord(ctx, word, x, y, size) {
  const k = size * 0.09;
  const parts = wordParts(word);
  let cursor = x;
  parts.forEach((part, i) => {
    const punct = PUNCT.test(part) && part.length === 1;
    if (punct && i > 0) cursor -= k;
    ctx.fillText(part, cursor, y);
    cursor += ctx.measureText(part).width;
    if (punct && i < parts.length - 1) cursor -= k;
  });
  return cursor - x;
}

/**
 * Texto con renglones automáticos. Lo que va entre *asteriscos* sale en el
 * color de énfasis; "\n" fuerza renglón. Devuelve la altura usada.
 */
function text(ctx, value, x, y, o) {
  const size = o.size;
  const lineHeight = o.lineHeight ?? Math.round(size * 1.2);
  ctx.save();
  ctx.font = font(o.weight ?? 700, size);
  ctx.letterSpacing = o.tracking ?? "0px";
  ctx.textBaseline = "alphabetic";
  const lines = [];
  for (const paragraph of value.split("\n")) {
    let line = [];
    let width = 0;
    let emph = false;
    for (const raw of paragraph.split(" ")) {
      const parts = raw.split("*");
      const words = [];
      parts.forEach((part, i) => {
        if (i > 0) emph = !emph;
        if (part) words.push({ text: part, emph });
      });
      const pieceWidth = words.reduce((sum, w) => sum + wordWidth(ctx, w.text, size), 0);
      const space = line.length ? ctx.measureText(" ").width : 0;
      if (line.length && width + space + pieceWidth > o.maxWidth) {
        lines.push({ words: line, width });
        line = [];
        width = 0;
      }
      if (line.length) {
        line.push({ text: " ", emph: words[0]?.emph ?? emph });
        width += ctx.measureText(" ").width;
      }
      line.push(...words);
      width += pieceWidth;
    }
    lines.push({ words: line, width });
  }
  lines.forEach((line, i) => {
    let cursor = o.align === "center" ? x - line.width / 2 : o.align === "right" ? x - line.width : x;
    const baseline = y + size + i * lineHeight;
    for (const word of line.words) {
      ctx.fillStyle = word.emph ? o.emphasis ?? o.color : o.color;
      cursor += drawWord(ctx, word.text, cursor, baseline, size);
    }
  });
  ctx.restore();
  return size + (lines.length - 1) * lineHeight + Math.round(size * 0.28);
}

function pill(ctx, label, x, y, o) {
  ctx.save();
  ctx.font = font(o.weight ?? 700, o.size);
  ctx.letterSpacing = o.tracking ?? "0px";
  const padX = o.padX ?? Math.round(o.size * 0.9);
  const h = o.height ?? Math.round(o.size * 2.1);
  const w = ctx.measureText(label).width + padX * 2;
  const left = o.align === "center" ? x - w / 2 : x;
  ctx.beginPath();
  ctx.roundRect(left, y, w, h, h / 2);
  if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
  if (o.stroke) { ctx.strokeStyle = o.stroke; ctx.lineWidth = 2; ctx.stroke(); }
  ctx.fillStyle = o.color;
  ctx.textBaseline = "middle";
  ctx.fillText(label, left + padX, y + h / 2 + 1);
  ctx.restore();
  return w;
}

/** Calles de una ciudad vistas desde arriba, con la ruta del mecánico hasta el auto. */
function drawMap(ctx, x, y, w, h, o = {}) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.fillStyle = C.navy;
  ctx.fillRect(x, y, w, h);

  const gap = o.gap ?? 150;
  const angle = o.angle ?? -0.21;
  // Dónde queda el cruce (0, 0) de las calles; la ruta se da en calles desde ahí.
  const cx = x + (o.origin ? o.origin[0] : w / 2);
  const cy = y + (o.origin ? o.origin[1] : h / 2);
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  const span = Math.hypot(w, h);

  // Parques y manzanas con un poco de color.
  ctx.fillStyle = "rgba(47, 143, 234, 0.09)";
  for (const [gx, gy] of o.parks ?? [[-2, -1], [1, 1]]) {
    ctx.beginPath();
    ctx.roundRect(gx * gap + 14, gy * gap + 14, gap - 28, gap - 28, 14);
    ctx.fill();
  }
  // Calles.
  ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
  ctx.lineWidth = 16;
  for (let i = -Math.ceil(span / gap); i <= Math.ceil(span / gap); i++) {
    ctx.beginPath(); ctx.moveTo(i * gap, -span); ctx.lineTo(i * gap, span); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-span, i * gap); ctx.lineTo(span, i * gap); ctx.stroke();
  }
  // Avenidas.
  ctx.strokeStyle = "rgba(255, 255, 255, 0.11)";
  ctx.lineWidth = 30;
  for (const i of o.avenues ?? [-1, 2]) {
    ctx.beginPath(); ctx.moveTo(i * gap, -span); ctx.lineTo(i * gap, span); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(-span, gap * (o.avenueRow ?? 0)); ctx.lineTo(span, gap * (o.avenueRow ?? 0)); ctx.stroke();

  // Ruta por las calles: del mecánico (inicio) al auto (fin).
  const route = (o.route ?? [[-3, 2], [-1, 2], [-1, 0], [1, 0], [1, -1]]).map(([gx, gy]) => [gx * gap, gy * gap]);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "rgba(47, 143, 234, 0.28)";
  ctx.lineWidth = 34;
  ctx.beginPath();
  route.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
  ctx.stroke();
  ctx.strokeStyle = C.bright;
  ctx.lineWidth = 12;
  ctx.stroke();

  // Posiciones en pantalla de los extremos (para dibujar los marcadores derechos).
  const toScreen = ([px, py]) => [cx + px * Math.cos(angle) - py * Math.sin(angle), cy + px * Math.sin(angle) + py * Math.cos(angle)];
  ctx.restore();

  const [mx, my] = toScreen(route[0]);
  const [ax, ay] = toScreen(route[route.length - 1]);
  const unit = o.marker ?? 1;
  // Mecánico: círculo azul con llave.
  ctx.save();
  ctx.beginPath(); ctx.arc(mx, my, 40 * unit, 0, Math.PI * 2);
  ctx.fillStyle = C.white; ctx.fill();
  ctx.beginPath(); ctx.arc(mx, my, 32 * unit, 0, Math.PI * 2);
  ctx.fillStyle = C.bright; ctx.fill();
  ctx.restore();
  drawIcon(ctx, "wrench", mx - 18 * unit, my - 18 * unit, 36 * unit, C.white, 2.3);
  // El auto: gota amarilla con el auto de la marca.
  ctx.save();
  const r = 54 * unit;
  ctx.translate(ax, ay - r * 1.55);
  ctx.beginPath();
  ctx.moveTo(0, r * 1.55);
  ctx.bezierCurveTo(-r * 0.35, r * 1.05, -r, r * 0.55, -r, 0);
  ctx.arc(0, 0, r, Math.PI, 0);
  ctx.bezierCurveTo(r, r * 0.55, r * 0.35, r * 1.05, 0, r * 1.55);
  ctx.closePath();
  ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
  ctx.shadowBlur = 24 * unit;
  ctx.shadowOffsetY = 8 * unit;
  ctx.fillStyle = C.sun;
  ctx.fill();
  ctx.restore();
  drawCar(ctx, ax, ay - r * 1.55, r * 1.25, C.navy);
  return { mechanic: [mx, my], car: [ax, ay] };
}

function logo(ctx, img, x, y, width, align = "left") {
  if (!img) return;
  const h = (width * img.height) / img.width;
  const left = align === "center" ? x - width / 2 : align === "right" ? x - width : x;
  ctx.drawImage(img, left, y, width, h);
}

/** Banda de abajo de las publicaciones: logo y dónde descargarla. */
function footer(ctx, W, H, assets, o = {}) {
  const h = 150;
  const top = H - h;
  ctx.fillStyle = o.fill ?? C.blue;
  ctx.fillRect(0, top, W, h);
  logo(ctx, o.dark ? assets.logoBlue : assets.logoWhite, 72, top + 54, 300);
  const color = o.dark ? C.navy : C.white;
  text(ctx, o.label ?? "Descárgala gratis", W - 72, top + 30, { size: 26, weight: 600, color, align: "right" });
  text(ctx, o.url ?? pretty(CONFIG.downloadUrl), W - 72, top + 66, { size: 36, weight: 800, color, align: "right", tracking: "-0.5px" });
}

function qrPath(ctx, value, x, y, size, color) {
  if (typeof qrcode === "undefined") return false;
  const qr = qrcode(0, "M");
  qr.addData(value);
  qr.make();
  const count = qr.getModuleCount();
  const cell = size / count;
  ctx.fillStyle = color;
  for (let r = 0; r < count; r++) {
    for (let c = 0; c < count; c++) {
      if (qr.isDark(r, c)) ctx.fillRect(Math.floor(x + c * cell), Math.floor(y + r * cell), Math.ceil(cell), Math.ceil(cell));
    }
  }
  return true;
}

      footer(ctx, W, H, assets, { fill: C.navy, label: "¿Tienes iPhone? Anótate y te avisamos", url: CONFIG.site });
    },
  },
];

// ---------------------------------------------------------------------------
// Página
// ---------------------------------------------------------------------------

async function ready() {
  const weights = [500, 600, 700, 800];
  try {
    await Promise.all(weights.map((w) => document.fonts.load(`${w} 40px "Plus Jakarta Sans"`)));
    await document.fonts.ready;
  } catch (e) { /* sin internet: usa la letra del sistema */ }
  const [logoWhite, logoBlue, appIcon] = await Promise.all([loadImage(LOGO_WHITE), loadImage(LOGO_BLUE), loadImage(APP_ICON)]);
  return { logoWhite, logoBlue, appIcon };
}

function render(image, assets) {
  const canvas = document.createElement("canvas");
  canvas.width = image.w;
  canvas.height = image.h;
  const ctx = canvas.getContext("2d");
  image.draw(ctx, image.w, image.h, assets);
  return canvas;
}

function download(canvas, name) {
  canvas.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }, "image/png");
}

async function copy(textarea, button) {
  try {
    await navigator.clipboard.writeText(textarea.value);
  } catch (e) {
    textarea.select();
    document.execCommand("copy");
  }
  const label = button.textContent;
  button.textContent = "Copiado";
  setTimeout(() => (button.textContent = label), 1500);
}

(async () => {
  const assets = await ready();
  const solo = new URLSearchParams(location.search).get("solo");
  if (solo) {
    const image = IMAGES.find((item) => item.id === solo);
    if (image) {
      document.body.classList.add("solo");
      document.getElementById("solo").appendChild(render(image, assets));
      document.title = "listo";
    }
    return;
  }
  const grid = document.getElementById("grid");
  for (const image of IMAGES) {
    const canvas = render(image, assets);
    const card = document.createElement("section");
    card.className = `card${image.wide ? " wide" : ""}${image.id === "perfil" ? " profile" : ""}`;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `<h2></h2><span>${image.w} × ${image.h} px</span>`;
    meta.querySelector("h2").textContent = image.title;
    const tip = document.createElement("p");
    tip.className = "tip";
    tip.textContent = image.tip;
    const actions = document.createElement("div");
    actions.className = "actions";
    const save = document.createElement("button");
    save.textContent = "Descargar PNG";
    save.addEventListener("click", () => download(canvas, image.file));
    actions.appendChild(save);
    card.append(meta, canvas, tip);
    if (image.caption) {
      const area = document.createElement("textarea");
      area.value = image.caption;
      area.setAttribute("aria-label", `Texto sugerido para ${image.title}`);
      const copyButton = document.createElement("button");
      copyButton.className = "soft";
      copyButton.textContent = "Copiar texto";
      copyButton.addEventListener("click", () => copy(area, copyButton));
      actions.appendChild(copyButton);
      card.append(area);
    }
    card.append(actions);
    grid.appendChild(card);
  }
})();
</script>
