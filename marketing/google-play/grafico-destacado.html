    <h1>Un mecánico que va<br><em>hasta tu auto<span class="pd-end">.</span></em></h1>
    <p>Mecánicos verificados a domicilio en Aguascalientes.</p>
  </div>
  <div class="onway"><i></i><div><b>Tu mecánico va en camino</b><span>Lo sigues en el mapa</span></div></div>

<script>
/** El auto del ícono de la app (cuadrícula de 1024). */
const CAR = [[380,421],[568,421],[632,483],[766,483],[798,515],[798,549],[810,558],[820,568],[820,596],[812,602],[776,602],[737,563],[690,563],[652,601],[398,601],[360,563],[300,563],[260,602],[212,602],[205,595],[205,567],[215,557],[226,549],[226,513],[250,487],[313,487]];
function carPath(cx, cy, width) {
  const s = width / 615;
  return 'M' + CAR.map(([x, y]) => (cx + (x - 512.5) * s).toFixed(2) + ' ' + (cy + (y - 511.5) * s).toFixed(2)).join('L') + 'Z';
}
// Calles giradas y la ruta del mecánico hasta el auto, como en el folleto.
const gap = 58, angle = -0.24, cx = 760, cy = 222, r = 22;
const cos = Math.cos(angle), sin = Math.sin(angle);
const at = (gx, gy) => [cx + gap * (gx * cos - gy * sin), cy + gap * (gx * sin + gy * cos)];
const deg = angle * 180 / Math.PI;
let streets = '';
for (let i = -16; i <= 16; i++) {
  streets += '<line x1="' + i * gap + '" y1="-900" x2="' + i * gap + '" y2="900" />';
  streets += '<line x1="-900" y1="' + i * gap + '" x2="900" y2="' + i * gap + '" />';
}
const avenues = [-3, 2].map((i) => '<line x1="' + i * gap + '" y1="-900" x2="' + i * gap + '" y2="900" />').join('') +
  '<line x1="-900" y1="' + (-1 * gap) + '" x2="900" y2="' + (-1 * gap) + '" />';
const parks = [[-4, -2], [1, -3], [-2, 1], [4, 1], [-6, 2]].map(([gx, gy]) =>
  '<rect x="' + (gx * gap + 8) + '" y="' + (gy * gap + 8) + '" width="' + (gap - 16) + '" height="' + (gap - 16) + '" rx="8" />').join('');
const route = [[-1, 2], [-1, 1], [1, 1], [1, 0], [2, 0]].map(([gx, gy]) => at(gx, gy));
const points = route.map(([x, y]) => x.toFixed(1) + ',' + y.toFixed(1)).join(' ');
const [mx, my] = route[0];
const [ax, ay] = route[route.length - 1];
const pinTop = ay - r * 2.55; // «top» choca con window.top
const drop = 'M' + ax + ' ' + ay + ' C' + (ax - r * 0.35) + ' ' + (ay - r * 0.5) + ' ' + (ax - r) + ' ' + (ay - r) + ' ' + (ax - r) + ' ' + (ay - r * 1.55) +
  ' A' + r + ' ' + r + ' 0 1 1 ' + (ax + r) + ' ' + (ay - r * 1.55) + ' C' + (ax + r) + ' ' + (ay - r) + ' ' + (ax + r * 0.35) + ' ' + (ay - r * 0.5) + ' ' + ax + ' ' + ay + 'Z';
document.getElementById('map').innerHTML =
  '<g transform="translate(' + cx + ' ' + cy + ') rotate(' + deg.toFixed(2) + ')">' +
  '<g fill="rgba(47,143,234,0.16)">' + parks + '</g>' +
  '<g stroke="rgba(255,255,255,0.08)" stroke-width="7">' + streets + '</g>' +
  '<g stroke="rgba(255,255,255,0.15)" stroke-width="14">' + avenues + '</g></g>' +
  '<polyline points="' + points + '" fill="none" stroke="rgba(47,143,234,0.3)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />' +
  '<polyline points="' + points + '" fill="none" stroke="#2f8fea" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />' +
  '<circle cx="' + mx + '" cy="' + my + '" r="16" fill="#fff" /><circle cx="' + mx + '" cy="' + my + '" r="13" fill="#2f8fea" />' +
  '<path transform="translate(' + (mx - 8) + ' ' + (my - 8) + ') scale(0.67)" d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" />' +
  '<path d="' + drop + '" fill="#f2b84b" />' +
  '<path d="' + carPath(ax, pinTop + r, r * 1.3) + '" fill="#08273a" />';
</script>
