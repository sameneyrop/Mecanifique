<meta charset="utf-8">

<title>Folleto media carta · Mecanifique</title>
<!--
  Folleto para conseguir clientes: media carta (5.5 × 8.5 in), SOLO FRENTE,
  acomodado DOS POR HOJA CARTA horizontal (11 × 8.5 in). Se corta por la línea
  punteada del centro.

  Todo lo arma JavaScript: el mapa de la portada (calles y la ruta del
  mecánico), el código QR con el enlace de descarga y el acomodo en la hoja.

  Imprimir (Chrome o Edge, Ctrl+P): tamaño Carta, orientación Horizontal,
  márgenes «Ninguno», escala 100 %, «Gráficos de fondo» activado, una sola
  cara. Cada folleto lleva un marco blanco, así que sale bien aunque la
  impresora no imprima hasta la orilla.

  Dos versiones del mismo folleto:
  - Corta (la de siempre): mapa, título, una frase, tres palomitas y el QR.
    Para dejar en la puerta: se entiende de un vistazo.
  - Completa (?version=completa): además, cómo funciona en tres pasos, por
    qué confiar, que la app no cuesta y cómo instalarla.

  Opciones (también en la barra de arriba de la página):
  - ?version=completa   la versión con más información
  - ?tinta=1   versión ahorro de tinta (el mapa en azul claro)
  - ?solo=1    la hoja a tamaño real, sin barra (para exportar la vista previa)
  Para otra ciudad u otro enlace, cambia CONFIG abajo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --navy: #08273a;
    --blue: #0072b2;
    --bright: #2f8fea;
    --sun: #f2b84b;
    --ink: #12374f;
    --muted: #5b7487;
    --pale: #eef5fb;
    --line: #d4e4f0;
    --white: #ffffff;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
    /* La portada en color: el mapa nocturno de la campaña de Facebook. */
    --hero-bg: var(--navy);
    --hero-ink: var(--white);
    --street: rgba(255, 255, 255, 0.08);
    --avenue: rgba(255, 255, 255, 0.15);
    --park: rgba(47, 143, 234, 0.16);
    --free-bg: var(--blue);
    --free-ink: var(--white);
  }
  /* Ahorro de tinta: el mapa en azul muy claro y la franja de $0 sin relleno. */
  body.ink {
    --hero-bg: #e7f0f9;
    --hero-ink: var(--navy);
    --street: rgba(0, 114, 178, 0.10);
    --avenue: rgba(0, 114, 178, 0.20);
    --park: rgba(0, 114, 178, 0.08);
    --free-bg: var(--pale);
    --free-ink: var(--navy);
  }

  @page { size: letter landscape; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #c9d6e0; font-family: var(--font); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* ---------- Barra de pantalla (no se imprime) ---------- */
  .toolbar { position: sticky; top: 0; z-index: 5; background: var(--white); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; }
  .toolbar strong { font-size: 16px; color: var(--navy); }
  .toolbar button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--blue); color: var(--white); cursor: pointer; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; cursor: pointer; }
  .toolbar .how { flex-basis: 100%; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
  .sheets { padding: 24px 0 48px; display: grid; justify-content: center; zoom: var(--fit, 1); }

  /* ---------- Hoja carta horizontal con dos folletos ---------- */
  .sheet { width: 11in; height: 8.5in; background: var(--white); position: relative; overflow: hidden;
    display: grid; grid-template-columns: 5.5in 5.5in; box-shadow: 0 6px 24px rgba(8, 39, 58, 0.18); }
  .cut { position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px dashed #a8bccb; }
  .cut::before, .cut::after { content: "✂"; position: absolute; left: -0.08in; font-size: 10pt; color: #8aa3b5; }
  .cut::before { top: 0.3in; transform: rotate(-90deg); }
  .cut::after { bottom: 0.3in; transform: rotate(90deg); }

  @media print {
    body { background: var(--white); }
    .toolbar { display: none; }
    .sheets { padding: 0; zoom: 1; display: block; }
    .sheet { box-shadow: none; }
  }
  body.solo { background: var(--white); }
  body.solo .toolbar { display: none; }
  body.solo .sheets { padding: 0; zoom: 1; display: block; }
  body.solo .sheet { box-shadow: none; }

  /* ---------- Un folleto (media carta, solo frente) ---------- */
  .flyer { width: 5.5in; height: 8.5in; padding: 0.3in; display: flex; flex-direction: column; overflow: hidden; }
  /* En esta tipografía el punto es muy ancho: a tamaño grande se ve despegado ("auto ."). */
  .pd { margin: 0 -0.05em; }
  .pd-end { margin-left: -0.07em; }

  .hero { position: relative; height: 2.2in; border-radius: 0.2in; overflow: hidden; background: var(--hero-bg); color: var(--hero-ink); flex-shrink: 0; }
  .hero svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-top { position: absolute; top: 0.18in; left: 0.2in; right: 0.18in; display: flex; justify-content: space-between; align-items: center; }
  .hero-top img { height: 0.23in; display: block; }
  .zone { font-size: 6.6pt; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sun);
    border: 1px solid rgba(242, 184, 75, 0.6); border-radius: 99px; padding: 0.045in 0.11in; }
  body.ink .zone { color: #8a5a00; border-color: rgba(138, 90, 0, 0.45); }
  .onway { position: absolute; left: 0.18in; bottom: 0.18in; background: var(--white); color: var(--navy); border-radius: 0.12in;
    padding: 0.07in 0.13in 0.07in 0.09in; display: flex; gap: 0.08in; align-items: center; box-shadow: 0 0.04in 0.14in rgba(0, 0, 0, 0.25); }
  body.ink .onway { box-shadow: 0 0 0 1px var(--line); }
  .onway .pulse { width: 0.11in; height: 0.11in; border-radius: 50%; background: #22a35a; box-shadow: 0 0 0 0.035in rgba(34, 163, 90, 0.22); flex-shrink: 0; }
  .onway b { display: block; font-size: 7.8pt; font-weight: 800; }
  .onway span { display: block; font-size: 6.5pt; color: var(--muted); font-weight: 600; }

  .copy { padding: 0.18in 0.04in 0; }
  .q { margin: 0 0 0.04in; font-size: 11.5pt; font-weight: 800; color: var(--blue); letter-spacing: -0.01em; }
  h1 { margin: 0; font-size: 26pt; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; color: var(--navy); }
  h1 em { font-style: normal; color: var(--blue); }
  .lead { margin: 0.09in 0 0; font-size: 9.6pt; line-height: 1.4; color: var(--ink); }
  .chips { margin: 0.1in 0.04in 0; display: flex; flex-wrap: wrap; gap: 0.05in; align-items: center; }
  .chips .label { font-size: 7.4pt; font-weight: 700; color: var(--muted); margin-right: 0.02in; }
  .chips .chip { font-size: 7.4pt; font-weight: 700; color: var(--navy); background: var(--pale); border: 1px solid var(--line); border-radius: 99px; padding: 0.03in 0.09in; }

  .steps { margin: 0.16in 0.04in 0; padding-top: 0.13in; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.12in; }
  .step .num { width: 0.24in; height: 0.24in; border-radius: 50%; background: var(--blue); color: var(--white); font-weight: 800; font-size: 8.6pt; display: grid; place-items: center; }
  .step b { display: block; margin: 0.06in 0 0.02in; font-size: 8.6pt; font-weight: 800; color: var(--navy); line-height: 1.2; }
  .step p { margin: 0; font-size: 7.5pt; line-height: 1.36; color: var(--ink); }

  .trust { margin: 0.13in 0.04in 0; display: grid; grid-template-columns: 1fr 1fr; gap: 0.05in 0.14in; }
  .trust span { display: inline-flex; align-items: center; gap: 0.05in; font-size: 8pt; font-weight: 700; color: var(--navy); }
  .trust svg { width: 0.14in; height: 0.14in; color: var(--blue); flex-shrink: 0; }

  .free { margin: 0.13in 0.04in 0.12in; background: var(--free-bg); color: var(--free-ink); border-radius: 0.13in; padding: 0.08in 0.14in; display: flex; gap: 0.12in; align-items: center; }
  body.ink .free { box-shadow: inset 0 0 0 1.5px var(--line); }
  .free .big { font-size: 19pt; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .free p { margin: 0; font-size: 8pt; line-height: 1.36; }

  .download { margin-top: auto; display: flex; gap: 0.15in; align-items: center; border: 1.5px solid var(--line); border-radius: 0.18in; padding: 0.13in; }
  .qr { width: 1.12in; height: 1.12in; flex-shrink: 0; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .download .label { margin: 0; font-size: 7pt; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .download .url { margin: 0.02in 0 0.05in; font-size: 13pt; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; line-height: 1.12; }
  .download .url span { color: var(--blue); }
  .badge { display: inline-block; font-size: 7.2pt; font-weight: 800; color: var(--navy); background: var(--sun); border-radius: 99px; padding: 0.025in 0.09in; }
  .download .how { margin: 0.06in 0 0; font-size: 7pt; line-height: 1.34; color: var(--ink); }
  .download .iphone { margin: 0.04in 0 0; font-size: 7pt; line-height: 1.34; color: var(--muted); }
  .download b { color: var(--ink); }

  /* ---------- Versión corta: menos texto, el QR más grande ---------- */
  .short .hero { height: 3.3in; }
  .short .copy { padding: 0.22in 0.04in 0; }
  .short .q { font-size: 13pt; margin-bottom: 0.05in; }
  .short h1 { font-size: 32pt; }
  .short .lead { margin-top: 0.12in; font-size: 11pt; line-height: 1.42; text-wrap: balance; }
  .short .checks { margin: 0.16in 0.04in 0; display: flex; flex-direction: column; gap: 0.07in; }
  .short .checks span { display: inline-flex; align-items: center; gap: 0.06in; font-size: 9.6pt; font-weight: 800; color: var(--navy); }
  .short .checks svg { width: 0.16in; height: 0.16in; color: var(--blue); flex-shrink: 0; }
  .short .download { padding: 0.15in; gap: 0.18in; }
  .short .qr { width: 1.42in; height: 1.42in; }
  .short .download .label { font-size: 7.6pt; }
  .short .download .url { font-size: 15pt; margin: 0.03in 0 0.07in; }
  .short .badge { font-size: 7.8pt; padding: 0.03in 0.1in; }
  .short .download .how { margin-top: 0.08in; font-size: 7.4pt; color: var(--muted); }
</style>
</head>

const pretty = (url) => url.replace(/^https?:\/\//, "");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Direcciones web con los puntos pegados a las letras (ver .pd en el CSS). */
const dots = (s) => esc(s).replace(/[.]/g, '<span class="pd">.</span>');

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/** El auto del ícono de la app (cuadrícula de 1024), como en las imágenes de Facebook. */
const CAR = [[380,421],[568,421],[632,483],[766,483],[798,515],[798,549],[810,558],[820,568],[820,596],[812,602],[776,602],[737,563],[690,563],[652,601],[398,601],[360,563],[300,563],[260,602],[212,602],[205,595],[205,567],[215,557],[226,549],[226,513],[250,487],[313,487]];
function carPath(cx, cy, width) {
  const s = width / 615;
  return "M" + CAR.map(([x, y]) => `${(cx + (x - 512.5) * s).toFixed(2)} ${(cy + (y - 511.5) * s).toFixed(2)}`).join("L") + "Z";
}

/**
 * Mapa de calles de la portada, con la ruta del mecánico hasta el auto. Las
 * calles van giradas; la ruta va por ellas y los marcadores quedan derechos.
 */
function mapSvg({ H = 230, gap = 40, cy = 134, r = 16 } = {}) {
  const W = 480, angle = -0.24;
  const cx = 240;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const at = (gx, gy) => [cx + gap * (gx * cos - gy * sin), cy + gap * (gx * sin + gy * cos)];
  const deg = (angle * 180) / Math.PI;
  let streets = "";
  for (let i = -14; i <= 14; i++) {
    streets += `<line x1="${i * gap}" y1="-600" x2="${i * gap}" y2="600" />`;
    streets += `<line x1="-600" y1="${i * gap}" x2="600" y2="${i * gap}" />`;
  }
  const avenues = [-3, 2].map((i) => `<line x1="${i * gap}" y1="-600" x2="${i * gap}" y2="600" />`).join("") +
    `<line x1="-600" y1="${-1 * gap}" x2="600" y2="${-1 * gap}" />`;
  const parks = [[-4, -2], [1, -3], [-2, 1], [4, 1]].map(([gx, gy]) =>
    `<rect x="${gx * gap + 6}" y="${gy * gap + 6}" width="${gap - 12}" height="${gap - 12}" rx="6" />`).join("");
  const route = [[1, 2], [1, 1], [3, 1], [3, 0], [4, 0]].map(([gx, gy]) => at(gx, gy));
  const points = route.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
  const [mx, my] = route[0];
  const [ax, ay] = route[route.length - 1];
  // Gota del auto: la punta queda sobre el final de la ruta.
  const top = ay - r * 2.55;
  const drop = `M${ax} ${ay} C${ax - r * 0.35} ${ay - r * 0.5} ${ax - r} ${ay - r} ${ax - r} ${ay - r * 1.55}
    A${r} ${r} 0 1 1 ${ax + r} ${ay - r * 1.55} C${ax + r} ${ay - r} ${ax + r * 0.35} ${ay - r * 0.5} ${ax} ${ay}Z`;
  return `<svg class="map" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g transform="translate(${cx} ${cy}) rotate(${deg.toFixed(2)})">
      <g fill="var(--park)">${parks}</g>
      <g stroke="var(--street)" stroke-width="5">${streets}</g>
      <g stroke="var(--avenue)" stroke-width="10">${avenues}</g>
    </g>
    <polyline points="${points}" fill="none" stroke="rgba(47,143,234,0.3)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="${points}" fill="none" stroke="#2f8fea" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="${mx}" cy="${my}" r="12" fill="#fff" />
    <circle cx="${mx}" cy="${my}" r="9.7" fill="#2f8fea" />
    <path transform="translate(${mx - 6} ${my - 6}) scale(0.5)" d="M14.7 6.3a4 4 0 00-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 005.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"
      fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" />
    <path d="${drop}" fill="#f2b84b" />
    <path d="${carPath(ax, top + r, r * 1.3)}" fill="#08273a" stroke="#08273a" stroke-width="0.3" stroke-linejoin="round" />
  </svg>`;
}

/** Código QR como SVG nítido (corrección "M": aguanta arrugas del papel). */
function qrSvg(text) {
  if (typeof qrcode === "undefined") return '<p style="font-size:7pt">Sin internet: no se generó el QR.</p>';
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount();
  const pad = 2;
  let d = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  const size = n + pad * 2;
  return `<svg viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="Código QR: ${esc(text)}">
    <rect width="${size}" height="${size}" fill="#fff"/><path d="${d}" fill="#08273a"/></svg>`;
}

function urlHtml(url) {
  const plain = pretty(url);
  const slash = plain.indexOf("/");
  return slash > 0 ? `${dots(plain.slice(0, slash))}<span>${dots(plain.slice(slash))}</span>` : dots(plain);
}

function flyer(ink) {
  const chips = ["No arranca", "Batería", "Frenos", "Se calienta", "Luz en el tablero"];
  const steps = [
    ["Pídelo", "Cuenta qué le pasa y dónde está tu auto: casa, trabajo o calle."],
    ["Un mecánico acepta", "Ves su foto y sus calificaciones, y lo sigues en el mapa."],
    ["Apruebas el precio", "Nada se repara sin tu visto bueno. Le pagas directo a él."],
  ];
  const trust = ["Identidad verificada", "Calificaciones reales", "Precio antes de reparar", "Botón de emergencia (911)"];
  return `<article class="flyer">
    <div class="hero">
      ${mapSvg()}
      <div class="hero-top"><img src="${ink ? LOGO_BLUE : LOGO_WHITE}" alt="Mecanifique"><span class="zone">${esc(CONFIG.city)} · a domicilio</span></div>
      <div class="onway"><span class="pulse"></span><div><b>Tu mecánico va en camino</b><span>Lo sigues en el mapa desde tu celular</span></div></div>
    </div>
    <div class="copy">
      <p class="q">¿Se descompuso tu auto?</p>
      <h1>Un mecánico que va<br><em>hasta tu auto<span class="pd-end">.</span></em></h1>
      <p class="lead">Sin grúa y sin llevarlo al taller: lo pides desde tu celular y ves quién es antes de que llegue.</p>
    </div>
    <div class="chips"><span class="label">Para cuando:</span>${chips.map((c) => `<span class="chip">${esc(c)}</span>`).join("")}</div>
    <div class="steps">${steps.map(([t, p], i) => `<div class="step"><span class="num">${i + 1}</span><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join("")}</div>
    <div class="trust">${trust.map((t) => `<span>${CHECK}${esc(t)}</span>`).join("")}</div>
    <div class="free"><span class="big">$0</span><p>Usar la app no te cuesta. La visita y la reparación se las pagas directo al mecánico.</p></div>
    <div class="download">
      <div class="qr">${qrSvg(CONFIG.downloadUrl)}</div>
      <div>
        <p class="label">Descárgala gratis</p>
        <p class="url">${urlHtml(CONFIG.downloadUrl)}</p>
        <span class="badge">App para Android</span>
        <p class="how">Ábrela en Chrome o escanea el código, toca <b>Descargar</b> y luego <b>Instalar</b>. Como todavía no está en Play Store, Android te pide permiso.</p>
        <p class="iphone">¿Tienes iPhone? Anótate en <b>${dots(CONFIG.site)}</b> y te avisamos.</p>
      </div>
    </div>
  </article>`;
}

/** Versión corta: lo que se entiende de un vistazo en la puerta. */

  const checks = ["Identidad verificada", "Precio antes de reparar", "Usar la app es gratis"];
  return `<article class="flyer short">
    <div class="hero">
      ${mapSvg({ H: 320, gap: 46, cy: 168, r: 18 })}
      <div class="hero-top"><img src="${ink ? LOGO_BLUE : LOGO_WHITE}" alt="Mecanifique"><span class="zone">${esc(CONFIG.city)} · a domicilio</span></div>
      <div class="onway"><span class="pulse"></span><div><b>Tu mecánico va en camino</b><span>Lo sigues en el mapa desde tu celular</span></div></div>
    </div>
    <div class="copy">
      <p class="q">¿Se descompuso tu auto?</p>
      <h1>Un mecánico que va<br><em>hasta tu auto<span class="pd-end">.</span></em></h1>
      <p class="lead">Pídelo desde tu celular: ves quién es y cuánto cobra antes de que llegue.</p>
    </div>
    <div class="checks">${checks.map((t) => `<span>${CHECK}${esc(t)}</span>`).join("")}</div>
    <div class="download">
      <div class="qr">${qrSvg(CONFIG.downloadUrl)}</div>
      <div>
        <p class="label">Descárgala gratis</p>
        <p class="url">${urlHtml(CONFIG.downloadUrl)}</p>
        <span class="badge">App para Android</span>
        <p class="how">Aún no está en Play Store: Android te pedirá permiso para instalarla. ¿iPhone? Anótate en <b>${dots(CONFIG.site)}</b>.</p>
      </div>
    </div>
  </article>`;
}

const params = new URLSearchParams(location.search);
const state = { ink: params.get("tinta") === "1", version: params.get("version") === "completa" ? "completa" : "corta" };

function render() {
  document.body.classList.toggle("ink", state.ink);
  const one = state.version === "completa" ? flyer(state.ink) : flyerShort(state.ink);
  document.getElementById("sheets").innerHTML = `<section class="sheet">${one}${one}<div class="cut" aria-hidden="true"></div></section>`;
  fit();
}

// En pantalla, que la hoja quepa a lo ancho; al imprimir va a tamaño real.
function fit() {
  const width = 11 * 96 + 32;
  document.documentElement.style.setProperty("--fit", String(Math.min(1, window.innerWidth / width)));
}

if (params.get("solo") === "1") document.body.classList.add("solo");
document.getElementById("ink").checked = state.ink;
document.getElementById(state.version === "completa" ? "v-completa" : "v-corta").checked = true;
document.querySelectorAll('input[name="version"]').forEach((input) =>
  input.addEventListener("change", (e) => { state.version = e.target.value; render(); }));
document.getElementById("ink").addEventListener("change", (e) => { state.ink = e.target.checked; render(); });
document.getElementById("print").addEventListener("click", () => window.print());
window.addEventListener("resize", fit);
render();
document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
