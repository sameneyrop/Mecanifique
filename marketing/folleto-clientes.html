<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folleto Mecanifique para clientes</title>
<!--
  Folleto para repartir a clientes (casa por casa), media carta (5.5 × 8.5 in),
  frente y vuelta.

  Ver y exportar:
  - Ábrelo en Chrome o Edge. Ctrl+P → "Guardar como PDF", márgenes "Ninguno",
    con "Gráficos de fondo" activado.
  - folleto-clientes.html          → 2 páginas media carta (para la imprenta)
  - folleto-clientes.html#casa     → hoja carta horizontal, 2 folletos por hoja
                                      (para imprimir en casa y cortar a la mitad)

  Para hacer otra versión (otra zona, otro enlace) cambia CONFIG abajo:
  el código QR se genera solo con el enlace que pongas.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --blue: #0f77b5;      /* azul de la marca (sitio web) */
    --blue-bright: #2f8fea;
    --navy: #08273a;
    --ink: #12374f;
    --muted: #5b7487;
    --pale: #eef5fb;
    --line: #d4e4f0;
    --sun: #f2b84b;       /* acento amarillo de la app */
    --white: #ffffff;
    --font: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  }
  @page { size: 5.5in 8.5in; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #c9d6e0; }
  body { font-family: var(--font); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  /* Una hoja = un lado del folleto. */
  .sheet {
    width: 5.5in; height: 8.5in; overflow: hidden; position: relative;
    background: var(--white); margin: 0.3in auto; box-shadow: 0 6px 24px rgba(8, 39, 58, 0.18);
    display: flex; flex-direction: column;
  }
  @media print {
    html, body { background: var(--white); }
    .sheet { margin: 0; box-shadow: none; break-after: page; }
    .sheet:last-child { break-after: auto; }
  }

  /* ---------- Frente ---------- */
  .front-top { padding: 0.42in 0.42in 0 0.42in; display: flex; justify-content: space-between; align-items: center; }
  .logo { height: 0.3in; }
  .zone { font-size: 7.5pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue);
    border: 1px solid var(--line); border-radius: 99px; padding: 0.05in 0.12in; }
  .headline { padding: 0.32in 0.42in 0.2in; }
  .headline .q { font-size: 15pt; font-weight: 700; color: var(--muted); margin: 0 0 0.06in; letter-spacing: -0.01em; }
  .headline h1 { margin: 0; font-size: 30pt; line-height: 1.02; font-weight: 800; letter-spacing: -0.035em; color: var(--navy); }
  .headline h1 em { font-style: normal; color: var(--blue); }
  .headline p { margin: 0.16in 0 0; font-size: 11pt; line-height: 1.45; color: var(--ink); max-width: 4.4in; }

  .steps { margin: 0.1in 0.3in 0; background: var(--blue); color: var(--white); border-radius: 0.22in;
    padding: 0.26in 0.28in; display: grid; gap: 0.2in; position: relative; overflow: hidden; }
  /* Las ondas del radar de la app, muy tenues, en la esquina. */
  .steps::after { content: ""; position: absolute; right: -0.9in; top: -0.9in; width: 2.4in; height: 2.4in; border-radius: 50%;
    border: 0.02in solid rgba(255, 255, 255, 0.12); box-shadow: 0 0 0 0.28in rgba(255, 255, 255, 0.05), 0 0 0 0.56in rgba(255, 255, 255, 0.035); }
  .step { display: grid; grid-template-columns: 0.4in 1fr; gap: 0.15in; align-items: start; position: relative; z-index: 1; }
  .num { width: 0.4in; height: 0.4in; border-radius: 50%; background: var(--white); color: var(--blue);
    font-weight: 800; font-size: 13pt; display: grid; place-items: center; }
  .step h2 { margin: 0.02in 0 0.04in; font-size: 12.5pt; font-weight: 800; letter-spacing: -0.01em; }
  .step p { margin: 0; font-size: 9.6pt; line-height: 1.4; color: rgba(255, 255, 255, 0.92); }

  .cta { margin-top: auto; padding: 0.24in 0.42in 0.4in; display: grid; grid-template-columns: 1.5in 1fr; gap: 0.22in; align-items: center; }
  .qr { width: 1.5in; height: 1.5in; padding: 0.06in; border: 1.5px solid var(--line); border-radius: 0.12in; background: var(--white); }
  .qr svg { width: 100%; height: 100%; display: block; }
  .cta .label { font-size: 8pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .cta .url { margin: 0.04in 0 0.08in; font-size: 15pt; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; line-height: 1.15; }
  .cta .url span { color: var(--blue); }
  .badge { display: inline-block; font-size: 8.5pt; font-weight: 700; color: var(--navy); background: var(--sun); border-radius: 99px; padding: 0.03in 0.11in; }
  .cta .iphone { margin: 0.08in 0 0; font-size: 8.5pt; color: var(--muted); line-height: 1.35; }
  .cta .iphone b { color: var(--ink); }

  /* ---------- Vuelta ---------- */
  .back-head { padding: 0.42in 0.42in 0.16in; }
  .back-head .eyebrow { margin: 0; font-size: 8pt; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--blue); }
  .back-head h2 { margin: 0.05in 0 0; font-size: 23pt; font-weight: 800; letter-spacing: -0.03em; color: var(--navy); line-height: 1.08; }
  .trust { padding: 0 0.42in; display: grid; grid-template-columns: 1fr 1fr; gap: 0.22in 0.24in; }
  .item { display: grid; grid-template-columns: 0.38in 1fr; gap: 0.11in; align-items: start; }
  .icon { width: 0.38in; height: 0.38in; border-radius: 0.11in; background: var(--pale); display: grid; place-items: center; }
  .icon svg { width: 0.22in; height: 0.22in; }
  .item h3 { margin: 0.01in 0 0.03in; font-size: 10pt; font-weight: 800; color: var(--navy); letter-spacing: -0.005em; }
  .item p { margin: 0; font-size: 8.6pt; line-height: 1.38; color: var(--muted); }

  .price { margin: 0.26in 0.42in 0; padding: 0.17in 0.2in; border-radius: 0.16in; background: var(--pale);
    display: grid; grid-template-columns: auto 1fr; gap: 0.18in; align-items: center; }
  .price strong { font-size: 23pt; font-weight: 800; color: var(--blue); letter-spacing: -0.03em; }
  .price p { margin: 0; font-size: 9.2pt; line-height: 1.4; color: var(--ink); }

  .install { margin: 0.24in 0.42in 0; }
  .install h3 { margin: 0 0 0.08in; font-size: 10pt; font-weight: 800; color: var(--navy); }
  .install ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.06in; counter-reset: paso; }
  .install li { counter-increment: paso; display: grid; grid-template-columns: 0.24in 1fr; font-size: 9pt; line-height: 1.38; }
  .install li::before { content: counter(paso); font-weight: 800; color: var(--blue); }
  .install .note { margin: 0.07in 0 0; font-size: 8pt; color: var(--muted); line-height: 1.35; }

  .referral { margin: auto 0.42in 0.18in; border: 1.5px dashed var(--blue); border-radius: 0.16in; padding: 0.14in 0.2in 0.16in; }
  .referral h3 { margin: 0; font-size: 10pt; font-weight: 800; color: var(--navy); }
  .referral .line { margin: 0.26in 0 0.07in; border-bottom: 1px solid var(--ink); height: 0; }
  .referral p { margin: 0; font-size: 8.4pt; color: var(--muted); line-height: 1.35; }
  .back-foot { padding: 0 0.42in 0.34in; display: flex; justify-content: space-between; align-items: center; font-size: 7.4pt; color: var(--muted); }
  .back-foot img { height: 0.17in; }

  /* ---------- Modo "casa": 2 folletos por hoja carta horizontal ---------- */
  .duo { display: none; }
  body.casa .solo { display: none; }
  body.casa .duo { display: block; }
  .letter {
    width: 11in; height: 8.5in; background: var(--white); margin: 0.3in auto; position: relative;
    display: grid; grid-template-columns: 5.5in 5.5in; box-shadow: 0 6px 24px rgba(8, 39, 58, 0.18);
  }
  .letter .sheet { margin: 0; box-shadow: none; }
  /* Línea de corte tenue al centro. */
  .letter::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 0.5px dashed #b9cad6; }
  @media print { .letter { margin: 0; box-shadow: none; break-after: page; } .letter:last-child { break-after: auto; } }
</style>
</head>
<body>

<!-- Los dos lados se escriben una vez aquí y se copian para cada modo. -->
<template id="front">
  <section class="sheet front" aria-label="Frente del folleto">
    <div class="front-top">
      <img class="logo" src="../web/assets/mecanifique-logo-blue.png" alt="Mecanifique">
      <span class="zone" data-zone></span>
    </div>
    <div class="headline">
      <p class="q">¿Se descompuso tu auto?</p>
      <h1>Pide un mecánico<br>que <em>vaya hasta tu auto.</em></h1>
      <p>Mecánicos de Aguascalientes con identidad verificada, a domicilio y desde tu celular. Sin buscar a quién llamar, sin llevar el auto al taller.</p>
    </div>
    <div class="steps">
      <div class="step">
        <span class="num">1</span>
        <div><h2>Pídelo desde la app</h2><p>Cuenta qué le pasa a tu auto y comparte dónde está: tu casa, el trabajo o la calle.</p></div>
      </div>
      <div class="step">
        <span class="num">2</span>
        <div><h2>Un mecánico cercano acepta</h2><p>Ves su foto y sus calificaciones, y lo sigues en el mapa mientras llega.</p></div>
      </div>
      <div class="step">
        <span class="num">3</span>
        <div><h2>Te cotiza antes de reparar</h2><p>Apruebas el precio en la app y le pagas directo a él. Sin sorpresas.</p></div>
      </div>
    </div>
    <div class="cta">
      <div class="qr" data-qr aria-label="Código QR para descargar la app"></div>
      <div>
        <p class="label">Descárgala gratis</p>
        <p class="url" data-url></p>
        <span class="badge">Para Android</span>
        <p class="iphone">¿Tienes iPhone? Anótate en <b data-site></b> y te avisamos cuando esté lista.</p>
      </div>
    </div>
  </section>
</template>

<template id="back">
  <section class="sheet back" aria-label="Vuelta del folleto">
    <div class="back-head">
      <p class="eyebrow">Por qué confiar</p>
      <h2>Tu auto, en buenas manos.</h2>
    </div>
    <div class="trust">
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/><path d="M8.8 12.2l2.2 2.2 4.2-4.4"/></svg></span>
        <div><h3>Identidad verificada</h3><p>Cada mecánico verifica su identidad antes de recibir solicitudes.</p></div>
      </div>
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8L12 3.5z"/></svg></span>
        <div><h3>Calificaciones reales</h3><p>Lo califican los clientes que ya atendió.</p></div>
      </div>
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg></span>
        <div><h3>Precio antes de reparar</h3><p>Su tarifa de visita está en su perfil, y nada se repara sin que apruebes la cotización.</p></div>
      </div>
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
        <div><h3>Fotos de antes y después</h3><p>Y un comprobante con lo que se hizo y la garantía que te dio.</p></div>
      </div>
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg></span>
        <div><h3>Lo ves llegar</h3><p>Sigues su ubicación en el mapa mientras va en camino.</p></div>
      </div>
      <div class="item">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#0f77b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.2v.1"/></svg></span>
        <div><h3>Botón de emergencia</h3><p>Si algo sale mal, llamas al 911 desde la app.</p></div>
      </div>
    </div>

    <div class="price">
      <strong>$0</strong>
      <p>Usar la app no te cuesta. Pagas la visita y la reparación directo al mecánico; cuánto cobra por la visita lo ves en su perfil.</p>
    </div>

    <div class="install">
      <h3>Cómo instalarla</h3>
      <ol>
        <li><span>Abre <b data-url-plain></b> en Chrome o escanea el código del frente.</span></li>
        <li><span>Toca <b>Descargar</b> y luego <b>Instalar</b>.</span></li>
        <li><span>Crea tu cuenta con <b>Soy cliente</b>. Listo.</span></li>
      </ol>
      <p class="note">Todavía no está en Play Store, por eso Android te pedirá permiso para instalarla.</p>
    </div>

    <div class="referral">
      <h3>Te la recomendó:</h3>
      <div class="line"></div>
      <p>Encuéntralo en la pestaña «Mecánicos» y toca «Pedir a este mecánico».</p>
    </div>

    <div class="back-foot">
      <img src="../web/assets/mecanifique-logo-blue.png" alt="Mecanifique">
      <span data-site></span>
    </div>
  </section>
</template>

<main class="solo"></main>
<main class="duo"></main>

<script>
  // Cambia aquí para hacer otra versión del folleto.
  const CONFIG = {
    zone: "Aguascalientes · Zona sur",
    downloadUrl: "https://mecanifique.vercel.app/app",
    site: "mecanifique.vercel.app",
  };

  const pretty = (url) => url.replace(/^https?:\/\//, "");

  function qrSvg(text) {
    // Corrección de errores "M": aguanta manchas o arrugas del papel.
    const qr = qrcode(0, "M");
    qr.addData(text);
    qr.make();
    const size = qr.getModuleCount();
    let path = "";
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (qr.isDark(r, c)) path += `M${c} ${r}h1v1h-1z`;
      }
    }
    return `<svg viewBox="-2 -2 ${size + 4} ${size + 4}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">` +
      `<rect x="-2" y="-2" width="${size + 4}" height="${size + 4}" fill="#fff"/>` +
      `<path d="${path}" fill="#08273a"/></svg>`;
  }

  function side(id) {
    const node = document.getElementById(id).content.firstElementChild.cloneNode(true);
    const url = pretty(CONFIG.downloadUrl);
    const slash = url.indexOf("/");
    node.querySelectorAll("[data-zone]").forEach((el) => (el.textContent = CONFIG.zone));
    node.querySelectorAll("[data-site]").forEach((el) => (el.textContent = CONFIG.site));
    node.querySelectorAll("[data-url-plain]").forEach((el) => (el.textContent = url));
    // El dominio en azul oscuro y la ruta en azul, para que "/app" no se pierda.
    node.querySelectorAll("[data-url]").forEach((el) => {
      el.textContent = slash > 0 ? url.slice(0, slash) : url;
      if (slash > 0) {
        const tail = document.createElement("span");
        tail.textContent = url.slice(slash);
        el.appendChild(tail);
      }
    });
    node.querySelectorAll("[data-qr]").forEach((el) => {
      try { el.innerHTML = qrSvg(CONFIG.downloadUrl); } catch (e) { el.textContent = "Sin conexión: no se generó el QR."; }
    });
    return node;
  }

  function build() {
    const casa = location.hash === "#casa";
    document.body.classList.toggle("casa", casa);

    const solo = document.querySelector(".solo");
    solo.replaceChildren(side("front"), side("back"));

    // Hoja 1: dos frentes. Hoja 2: dos vueltas. Como los dos folletos de cada
    // hoja son iguales, no importa cómo voltee la hoja la impresora.
    const duo = document.querySelector(".duo");
    const letter = (id) => {
      const page = document.createElement("div");
      page.className = "letter";
      page.append(side(id), side(id));
      return page;
    };
    duo.replaceChildren(letter("front"), letter("back"));

    let pageStyle = document.getElementById("page-size");
    if (!pageStyle) {
      pageStyle = document.createElement("style");
      pageStyle.id = "page-size";
      document.head.appendChild(pageStyle);
    }
    pageStyle.textContent = casa ? "@page { size: 11in 8.5in; margin: 0; }" : "@page { size: 5.5in 8.5in; margin: 0; }";
  }

  window.addEventListener("hashchange", build);
  build();
</script>
</body>
</html>
