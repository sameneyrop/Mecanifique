services:
  - type: web
    name: mecanifique-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: mecanifique-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
