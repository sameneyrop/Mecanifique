services:
  - type: web
    name: mecanifique-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
    disk:
      name: mecanifique-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
